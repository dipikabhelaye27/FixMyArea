name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Build & Verify Production Bundles
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: |
          npm ci || npm install
          cd client && npm ci || npm install && cd ..
          cd server && npm ci || npm install && cd ..

      - name: Verify Client Vite Production Build
        run: |
          cd client
          npm run build

      - name: Verify Serverless API Entrypoint
        run: |
          node -e "const app = require('./api/index'); console.log('API entrypoint verified:', typeof app);"
